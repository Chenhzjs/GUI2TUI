<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GUI2TUI Browser Fixture</title>
</head>
<body>
  <h1>GUI2TUI Browser Fixture</h1>

  <label>
    Username
    <input aria-label="Username" value="alice">
  </label>

  <label>
    Password
    <input aria-label="Password" type="password" value="browser-phase-secret">
  </label>

  <label>
    <input id="feature" type="checkbox" aria-label="Enable feature">
    Enable feature
  </label>

  <button id="activate">Activate safely</button>
  <div id="status" role="status">Status: idle</div>

  <label>
    Demo items
    <select aria-label="Demo items">
      <option>Alpha</option>
      <option>Beta</option>
      <option>Gamma</option>
    </select>
  </label>

  <section aria-label="Object churn controls">
    <button id="replace">Replace subtree</button>
    <div id="replaceable">
      <button aria-label="Churn target">Churn target</button>
    </div>
  </section>

  <section aria-label="Dynamic tree controls">
    <button id="add-items">Add 100 items</button>
    <button id="remove-items">Remove 100 items</button>
    <button id="toggle-hidden">Toggle hidden section</button>
    <div id="dynamic-items"></div>
    <div id="hidden-section" hidden>
      <h2>Hidden controls</h2>
      <button>Hidden action</button>
      <input aria-label="Hidden input" value="hidden">
    </div>
  </section>

  <script>
    document.querySelector('#activate').onclick = () => {
      document.querySelector('#feature').checked = true;
      document.querySelector('#status').textContent = 'Status: activated';
    };

    document.querySelector('#replace').onclick = () => {
      const replacement = document.createElement('button');
      replacement.setAttribute('aria-label', 'Churn target');
      replacement.textContent = 'Churn target';
      document.querySelector('#replaceable').replaceChildren(replacement);
    };

    document.querySelector('#add-items').onclick = () => {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < 100; index += 1) {
        const button = document.createElement('button');
        button.textContent = `Dynamic item ${index}`;
        fragment.append(button);
      }
      document.querySelector('#dynamic-items').replaceChildren(fragment);
    };

    document.querySelector('#remove-items').onclick = () => {
      document.querySelector('#dynamic-items').replaceChildren();
    };

    document.querySelector('#toggle-hidden').onclick = () => {
      const section = document.querySelector('#hidden-section');
      section.hidden = !section.hidden;
    };
  </script>
</body>
</html>
