# Optional user configuration. Missing files use these defaults.
# Copy to the path printed by `gui2tui config path`, or run `gui2tui config init`.
# Unknown fields and unsupported versions are errors. CLI overrides the file.
version = 1

[runtime]
backend_timeout_ms = 5000
event_queue_capacity = 2048

[terminal]
mouse = true

# Optional shell-free handler for runtime-qualified complete multiline plain text.
# No handler is assumed by default. {file} is a private GUI2TUI representation,
# not an application's backing file.
# [interaction.complex_text]
# program = "custom-editor-command"
# args = ["--wait", "{file}"]
