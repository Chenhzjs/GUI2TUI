[package]
name = "gui2tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Phase 0 AT-SPI semantic UI inspector for GUI2TUI"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gui2tui-inspect"
path = "src/main.rs"

[dependencies]
atspi = { version = "0.30", features = ["tracing", "zbus"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "5.19"
